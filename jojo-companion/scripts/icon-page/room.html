<!doctype html>
<html><head><meta charset="utf-8"><title>room</title></head>
<body style="margin:0">
<script type="module">
import { RigRenderer } from '../../src/renderer/shared/rig-renderer.js';
import { Animator } from '../../src/renderer/shared/animator.js';
import { Effects } from '../../src/renderer/shared/effects.js';
import { rigComVisuais, gerarVisuais, canaisVisual } from '../../src/core/visual-nivel.js';
import { rigComRebolado } from '../../src/core/rebolado.js';
// Mede quanto cada animação (com efeitos) passa da caixa do JoJo.
const O = 400, SIZE = 1000;
function bbox(ctx, box) {
  const d = ctx.getImageData(0, 0, SIZE, SIZE).data;
  let x0 = SIZE, y0 = SIZE, x1 = -1, y1 = -1;
  for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
    if (d[(y * SIZE + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) return { l: 0, t: 0, r: 0, b: 0 };
  const c = (v) => Math.max(0, Math.ceil(v + 2));
  return { l: c(O - x0), t: c(O - y0), r: c(x1 + 1 - (O + box.width)), b: c(y1 + 1 - (O + box.height)) };
}
function canvas() {
  const c = document.createElement('canvas'); c.width = SIZE; c.height = SIZE;
  return c.getContext('2d', { willReadFrequently: true });
}
function drawFrame(ctx, rig, s, fx, now, head, mouth) {
  rig.draw(ctx, s.pose, { origin: { x: O, y: O }, scale: 1, facing: 1 });
  if (!fx) return;
  fx.update(now, s.flags, head);
  ctx.save(); ctx.translate(O, O); ctx.translate(s.pose.rootX || 0, s.pose.rootY || 0);
  fx.drawBack(ctx, now, { head, facingSign: 1 });
  fx.draw(ctx, now, { mark: s.flags.mark, head, mouth, facingSign: 1 });
  ctx.restore();
}
// Movimento dos visuais no extremo (aura maior, moscas longe, bolhas no alto, baba esticada).
const MOVIMENTO = [
  { nvAura: 1.06, nvMoscaX: 7, nvMoscaY: 5, nvBolhas: -14, nvSuor: 12, nvBaba: 1.2, nvBarriga: 1.06, nvPapada: 3.4, nvBrilho: 1.15, nvBrilho2: 1.15 },
  { nvAura: 0.95, nvMoscaX: -7, nvMoscaY: -5, nvBolhas: 0, nvSuor: 0, nvBaba: 1, nvBarriga: 0.95, nvPapada: -3.4, nvBrilho: 0.55, nvBrilho2: 0.55 },
];
window.measure = async (rigJson, animJson, foodJson = { foods: [] }, niveis = null) => {
  // Mesmo desenho do overlay: visuais de nível e o modelo do rebolado.
  const rigFull = niveis ? rigComRebolado(rigComVisuais(rigJson, niveis)) : rigComRebolado(rigJson);
  const rig = new RigRenderer(rigFull);
  // Sem visuais o desenho é muito mais leve: as animações comuns medem com ele; as que vestem
  // peças de visual na própria animação (Tigresa) medem com o desenho completo.
  const rigLeve = new RigRenderer(rigComRebolado(rigJson));
  const COM_VISUAL = new Set(['tigresa']);
  const box = rigJson.metrics.box, head = rigJson.metrics.head, mouth = rigJson.metrics.mouth;
  const out = { anims: {}, effects: {} };
  for (const [name, anim] of Object.entries(animJson.animations)) {
    if (name === 'hidden') continue;
    // Catálogo: mede as três intensidades e guarda a união no nome-base (a suave pode
    // ir para outro lado que a exagerada).
    const ctx = canvas();
    let i = 0;
    for (const seed of [0.01, 0.5, 0.99]) {
      const a = new Animator(animJson, { rng: () => seed });
      a.play(name, 0, { variant: name });
      const fx = new Effects({ rng: () => seed });
      const dur = anim.duration || 1000;
      const r0 = COM_VISUAL.has(name) ? rig : rigLeve;
      for (let t = 0; t <= dur + 400; t += 1000 / 24) drawFrame(ctx, r0, a.sample(t), fx, t, head, mouth);
      i++;
    }
    const base = (anim.variantOf || name).replace(/~.*$/, '');
    const r = bbox(ctx, box), prev = out.anims[base];
    out.anims[base] = prev ? { l: Math.max(prev.l, r.l), t: Math.max(prev.t, r.t), r: Math.max(prev.r, r.r), b: Math.max(prev.b, r.b) } : r;
  }
  // Com visual vestido: cada animação com TODOS os visuais ligados ao mesmo tempo, na maior
  // cabeça e no corpo mais largo (envelope máximo); e o espaço de cada visual parado.
  if (niveis) {
    const cat = gerarVisuais(niveis);
    const todos = {};
    let cab = 1, corpo = 1;
    for (const p of cat) {
      Object.assign(todos, canaisVisual({ pecas: { [p.parte]: p.id } }, niveis, 999) || {});
      cab = Math.max(cab, p.transforma?.cabeca || 1);
      corpo = Math.max(corpo, p.transforma?.corpo || 1);
    }
    for (const k of Object.keys(todos)) if (/^costume_/.test(k)) delete todos[k];
    Object.assign(todos, { nvCabeca: cab, nvCorpo: corpo, nvOlhos: 0, pelado: 0 });
    out.animsVisual = {};
    for (const [name, anim] of Object.entries(animJson.animations)) {
      if (name === 'hidden') continue;
      const ctx = canvas();
      // 13 quadros espalhados pela animação bastam para o envelope (todos os visuais juntos são pesados).
      const a = new Animator(animJson, { rng: () => 0.5 });
      a.play(name, 0, { variant: name });
      const dur = anim.duration || 1000;
      for (let i = 0; i <= 12; i++) { const s = a.sample((dur * i) / 12); rig.draw(ctx, { ...s.pose, ...todos, ...MOVIMENTO[i % 2] }, { origin: { x: O, y: O }, scale: 1, facing: 1 }); }
      const base = (anim.variantOf || name).replace(/~.*$/, '');
      const r = bbox(ctx, box), prev = out.animsVisual[base];
      out.animsVisual[base] = prev ? { l: Math.max(prev.l, r.l), t: Math.max(prev.t, r.t), r: Math.max(prev.r, r.r), b: Math.max(prev.b, r.b) } : r;
    }
    out.visuais = {};
    const repouso = new Animator(animJson, { rng: () => 0.5 });
    for (const p of cat) {
      const ctx = canvas();
      const ch = canaisVisual({ pecas: { [p.parte]: p.id } }, niveis, 999) || {};
      for (const mov of MOVIMENTO) for (const t of [0, 400, 800, 1200]) {
        repouso.play('idle', 0, { restart: true });
        rig.draw(ctx, { ...repouso.sample(t).pose, ...ch, ...mov, tgPinto: 22 }, { origin: { x: O, y: O }, scale: 1, facing: 1 });
      }
      out.visuais[p.id] = bbox(ctx, box);
    }
  }
  // Efeitos ligados pelo companion (comida, bola, corações) sobre a pose parada.
  const idle = { pose: { ...animJson.channels }, flags: {} };
  for (const [eff, kinds] of [['food', foodJson.foods.length ? foodJson.foods.map(f => f.id) : ['peixe', 'foca', 'lula', 'tartaruga', 'pinguim', 'humano']], ['ball', [null]], ['hearts', [null]]]) {
    const ctx = canvas();
    for (const kind of kinds) {
      const fx = new Effects({ rng: () => 0.5 });
      fx.loadFoods(foodJson.foods);
      if (eff === 'food') { const image = fx.foodImage(kind); if (image) await image.decode(); }
      fx.setEffect(eff, 0, kind);
      for (let t = 0; t <= 4000; t += 1000 / 24) { fx.update(t, {}, head); ctx.save(); ctx.translate(O, O); fx.draw(ctx, t, { head, mouth, facingSign: 1 }); ctx.restore(); }
    }
    out.effects[eff] = bbox(ctx, box);
  }
  return out;
};
window.ready = true;
</script></body></html>
