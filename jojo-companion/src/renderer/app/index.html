<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>JoJo</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="../shared/todo.css">
  <link rel="stylesheet" href="../shared/progress.css">
</head>
<body>
  <aside id="side">
    <header class="brand">
      <img src="../../../assets/icons/app.png" alt="" width="40" height="40">
      <div>
        <strong id="name">JoJo</strong>
        <small>JoJo Companion</small>
      </div>
    </header>
    <nav id="list" aria-label="Conversas"></nav>
    <button id="colecaoBtn" class="wide ghost">🏆 Coleção e jogos</button>
    <button id="guardaBtn" class="wide ghost">👗 Guarda-roupa</button>
    <button id="tarefasBtn" class="wide ghost">✓ Lista de Tarefas</button>
    <button id="darkestBtn" class="wide ghost">◈ Steam e Darkest Dungeon</button>
    <button id="cuidadosBtn" class="wide ghost">♡ Cuidados e cardápio</button>
    <button id="trabalhoBtn" class="wide ghost">🧘 Modo Trabalho</button>
    <p id="discordFocusStatus" class="muted" aria-live="polite"></p>
    <footer class="side-foot">
      <button id="petToggle" class="wide"></button>
      <button id="settings" class="wide ghost">Configurações</button>
    </footer>
  </aside>
  <main id="main">
    <header class="conv-head">
      <h1 id="convTitle">Conversa</h1>
      <span id="convStatus" class="chip hidden"></span>
    </header>
    <p id="convDetail" class="detail hidden"></p>
    <div id="progression" aria-live="polite"></div>
    <section id="colecao" class="colecao hidden" aria-label="Coleção e jogos"></section>
    <section id="guardaRoupa" class="colecao hidden" aria-label="Guarda-roupa"></section>
    <section id="tarefas" class="hidden" aria-label="Lista de Tarefas"></section>
    <section id="darkest" class="colecao hidden" aria-label="Darkest Dungeon"></section>
    <section id="cuidados" class="colecao hidden" aria-label="Cuidados e cardápio"></section>
    <div id="log" role="log" aria-live="polite"></div>
    <div id="cmdMenu" class="cmd-menu hidden" role="listbox" aria-label="Comandos"></div>
    <form id="form" autocomplete="off">
      <input id="input" type="text" maxlength="200" placeholder='Fale com o JoJo… ("/" abre os comandos)' aria-label="Mensagem">
      <button type="submit" title="Enviar">➤</button>
    </form>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
