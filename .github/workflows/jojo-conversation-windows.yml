name: JoJo — conversa real no Windows (avaliação)
run-name: JoJo conversa — ${{ contains(github.event.head_commit.message, '[jojo-net]') && 'rede do modelo' || (inputs.ui_only || contains(github.event.head_commit.message, '[jojo-ui]')) && 'somente Central' || 'engine e Central' }} — ${{ github.ref_name }}

on:
  push:
    branches: ['codex/living-companion']
  workflow_dispatch:
    inputs:
      ui_only:
        description: Diagnosticar somente a Central com modelo real; nao equivale aos gates integrais
        type: boolean
        default: false
      model:
        description: Modelo avaliado somente neste ensaio; nao altera o modelo do aplicativo
        type: choice
        default: 'gemma3:4b-it-q4_K_M'
        options:
          - 'gemma3:4b-it-q4_K_M'
          - 'qwen3:4b-instruct-2507-q4_K_M'
          - 'llama3.1:8b-instruct-q4_K_M'
          - 'ministral-3:3b-instruct-2512-q4_K_M'

permissions:
  contents: read

concurrency:
  group: jojo-conversation-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rede-modelo:
    if: ${{ github.repository == 'oaovito/oao-companion-' && github.event_name == 'push' && contains(github.event.head_commit.message, '[jojo-net]') }}
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Verificar manifesto e transferencia parcial sem baixar o modelo inteiro
        working-directory: jojo-companion
        run: node scripts/check-model-network.mjs

  conversa-real:
    # Avaliacao por dispatch ou marcador explicito; o pipeline completo ja executa o ensaio.
    if: ${{ github.repository == 'oaovito/oao-companion-' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[jojo-ui]') || contains(github.event.head_commit.message, '[jojo-qa]')) }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Comparação parcial explícita; cada modelo executa o mesmo ensaio completo.
        # As escolhas daqui não alteram o contrato do modelo oficial do aplicativo.
        model: >-
          ${{ contains(github.event.head_commit.message, '[jojo-qa]') &&
              contains(github.event.head_commit.message, '[compare-grounded]') &&
              fromJSON('["gemma3:4b-it-q4_K_M","ministral-3:3b-instruct-2512-q4_K_M"]') ||
              fromJSON(format('[{0}]', toJSON(inputs.model ||
                (contains(github.event.head_commit.message, '[llama8]') && 'llama3.1:8b-instruct-q4_K_M') ||
                (contains(github.event.head_commit.message, '[qwen4]') && 'qwen3:4b-instruct-2507-q4_K_M') ||
                'gemma3:4b-it-q4_K_M'))) }}
    defaults:
      run:
        shell: pwsh
        working-directory: jojo-companion
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.ref == 'refs/heads/main' && 'codex/conversation-coherence' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Instalar dependências da interface Windows
        run: npm ci
      - name: Avaliar candidato com o mesmo ensaio obrigatório do pipeline oficial
        timeout-minutes: 25
        run: ./scripts/check-conversation-windows.ps1
        env:
          # Só o ensaio seleciona um candidato; não muda o modelo do aplicativo.
          JOJO_QA_MODEL: ${{ matrix.model }}
          # A comparação exige engine e Central; demais ensaios preservam ui_only.
          JOJO_QA_UI_ONLY: ${{ !(contains(github.event.head_commit.message, '[jojo-qa]') && contains(github.event.head_commit.message, '[compare-grounded]')) && (inputs.ui_only || contains(github.event.head_commit.message, '[jojo-ui]')) }}
