name: JoJo — conversa real no Windows (avaliação)
run-name: JoJo conversa — ${{ (inputs.ui_only || contains(github.event.head_commit.message, '[jojo-ui]')) && 'somente Central' || 'engine e Central' }} — ${{ github.ref_name }}

on:
  push:
    branches: ['codex/living-companion']
  workflow_dispatch:
    inputs:
      ui_only:
        description: Diagnosticar somente a Central com modelo real; nao equivale aos gates integrais
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jojo-conversation-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conversa-real:
    # Avaliacao opcional somente por dispatch; o pipeline completo ja executa o ensaio.
    if: ${{ github.repository == 'oaovito/oao-companion-' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[jojo-ui]') || contains(github.event.head_commit.message, '[jojo-qa]')) }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model:
          - 'gemma3:4b-it-q4_K_M'
    defaults:
      run:
        shell: pwsh
        working-directory: jojo-companion
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.ref == 'refs/heads/main' && 'codex/conversation-coherence' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Instalar dependências da interface Windows
        run: npm ci
      - name: Avaliar candidato com o mesmo ensaio obrigatório do pipeline oficial
        timeout-minutes: 25
        run: ./scripts/check-conversation-windows.ps1
        env:
          # Só o ensaio seleciona um candidato; não muda o modelo do aplicativo.
          JOJO_QA_MODEL: ${{ matrix.model }}
          JOJO_QA_UI_ONLY: ${{ inputs.ui_only || contains(github.event.head_commit.message, '[jojo-ui]') }}
