name: JoJo — conversa real no Windows (avaliação)

on:
  push:
    branches: ['qa/conversation-models']
    paths:
      - '.github/workflows/jojo-conversation-windows.yml'
      - 'jojo-companion/scripts/check-conversation*'
      - 'jojo-companion/test/e2e/conversation-real.windows.mjs'
      - 'jojo-companion/src/core/dialogue/**'
      - 'jojo-companion/src/main/cerebro-local.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jojo-conversation-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conversa-real:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model:
          - 'gemma3:4b-it-q4_K_M'
    defaults:
      run:
        shell: pwsh
        working-directory: jojo-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências da interface Windows
        run: npm ci
      - name: Avaliar candidato com o mesmo ensaio obrigatório do pipeline oficial
        timeout-minutes: 25
        run: ./scripts/check-conversation-windows.ps1
        env:
          # Só o ensaio seleciona um candidato; não muda o modelo do aplicativo.
          JOJO_QA_MODEL: ${{ matrix.model }}
