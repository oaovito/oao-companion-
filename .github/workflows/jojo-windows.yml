name: JoJo Companion (Windows)

on:
  push:
    branches: ['main', 'claude/**', 'codex/**']
    tags: ['v*']
    paths: ['jojo-companion/**', '.github/workflows/jojo-windows.yml', 'AGENTS.md', 'CLAUDE.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jojo-windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: jojo-companion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jojo-companion/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Conferir tag oficial, token e ausência de versão histórica
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/publish-release.mjs --check
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      - name: Testes unitários
        run: npm test

      - name: Auditar acesso ao canal público (sem publicar)
        run: node scripts/publish-release.mjs --access
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      - name: Gerar executável portátil, instalador e ZIP
        if: success() || failure()
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Executável portátil (abre sem instalar)
        if: success() || failure()
        run: node scripts/smoke-portable.mjs dist/JoJoCompanion.exe

      - name: Conferir os três formatos de distribuição
        run: node scripts/publish-release.mjs --artifacts

      - name: Presença permanente (crash reabre; bandeja não; atalho na área de trabalho)
        if: success() || failure()
        timeout-minutes: 6
        run: node scripts/presenca-windows.mjs dist/JoJoCompanion.exe

      - name: Pesquisa na internet (fontes reais)
        if: success() || failure()
        continue-on-error: true
        run: node scripts/check-web-search.mjs

      - name: Integração no Windows (entrada real de mouse/teclado)
        if: success() || failure()
        run: npm run test:windows

      - name: E2E do aplicativo Windows
        if: success() || failure()
        run: npm run test:e2e

      - name: Auditar todas as animações no renderer Windows
        if: success() || failure()
        timeout-minutes: 10
        run: npm run audit:animations

      - name: Registrar auditoria de animações no resumo
        if: ${{ !cancelled() }}
        run: |
          if (Test-Path 'docs/auditoria-animacoes.json') {
            Get-Content -Raw 'docs/auditoria-animacoes.json' | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

      - name: Medir CPU e memória
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: node scripts/measure.mjs | Tee-Object -FilePath measure-windows.json
        env:
          MEASURE_SECONDS: '20'

      - name: Medir com aceleração de vídeo (comparação)
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        continue-on-error: true
        run: node scripts/measure.mjs | Tee-Object -FilePath measure-windows-gpu.json
        env:
          MEASURE_SECONDS: '20'
          JOJO_GPU: '1'

      - name: Validar conversa e Central com o modelo local real no Windows
        timeout-minutes: 25
        run: ./scripts/check-conversation-windows.ps1

      # Cópia de conferência do CI (a versão de verdade vai na Release). Cota cheia não bloqueia a publicação.
      - name: Publicar artefatos
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: JoJoCompanion-windows-x64
          path: |
            jojo-companion/dist/*.exe
            jojo-companion/dist/*.zip
            jojo-companion/measure-windows.json
            jojo-companion/measure-windows-gpu.json
            jojo-companion/docs/AUDITORIA_ANIMACOES.md
            jojo-companion/docs/auditoria-animacoes.json
            jojo-companion/docs/auditoria-animacoes.png
          if-no-files-found: warn
          retention-days: 2

      # Apenas uma tag oficial nova publica. Push de branch e execução manual só validam.
      - name: Publicar e verificar a nova versão pública
        if: success() && startsWith(github.ref, 'refs/tags/v')
        run: node scripts/publish-release.mjs
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
