name: JoJo Companion (Windows)
run-name: JoJo Windows — ${{ github.event_name }} — ${{ github.ref_name }}

on:
  push:
    branches: ['main', 'claude/**', 'codex/**']
    tags: ['v*']
    paths: ['jojo-companion/**', 'ci/**', '.github/workflows/jojo-windows.yml', 'AGENTS.md', 'CLAUDE.md']
  workflow_dispatch:
    inputs:
      assets_only:
        description: Medir desenho e testar painel no Windows, sem build ou publicacao
        type: boolean
        default: false
      measure_assets:
        description: Medir e auditar desenho no diagnostico (desligar para testar somente interfaces)
        type: boolean
        default: true
      recovery:
        description: Retomar a versao pendente autorizada depois de todos os gates
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: jojo-official-windows
  cancel-in-progress: false

jobs:
  windows:
    # Tentativa normal autorizada pelo usuario; controles financeiros do GitHub intactos.
    # main guarda somente o controle horario; o aplicativo continua na branch Codex.
    if: ${{ github.repository == 'oaovito/oao-companion-' && !inputs.assets_only && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref == 'refs/heads/main' && 'codex/conversation-coherence' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: jojo-companion/package-lock.json
      - name: Auditar acesso ao canal publico, sem publicar
        working-directory: jojo-companion
        run: node scripts/publish-release.mjs --access
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      - name: Todos os gates Windows originais e melhorias de integridade
        id: validation
        run: node jojo-companion/scripts/actions-windows.mjs
        env:
          JOJO_CI_CACHE: ${{ runner.temp }}/jojo-actions-cache
      - name: Validar autenticacao iCloud real e concluir evidencia da candidata
        if: ${{ steps.validation.outputs.version != '0.44.0' }}
        run: node jojo-companion/scripts/finalize-icloud-validation.mjs
        env:
          VALIDATION_REPORT: ${{ steps.validation.outputs.report_path }}
          JOJO_ICLOUD_USER: ${{ secrets.JOJO_ICLOUD_USER }}
          JOJO_ICLOUD_APP_PASSWORD: ${{ secrets.JOJO_ICLOUD_APP_PASSWORD }}
      - name: Registrar relatorio privado
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if (Test-Path 'jojo-companion/out/windows-ci/summary/validation.json') {
            Get-Content -Raw -Encoding utf8 'jojo-companion/out/windows-ci/summary/validation.json' | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }
      - name: Artefatos e evidencias do CI
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: JoJoCompanion-windows-x64-${{ github.run_id }}
          path: |
            jojo-companion/dist/*.exe
            jojo-companion/dist/*.zip
            jojo-companion/out/windows-ci/summary
          retention-days: 1
          if-no-files-found: warn
      - name: Preparar somente a nova tag validada
        if: ${{ success() && (inputs.recovery || github.ref_type == 'tag' || github.ref == 'refs/heads/codex/conversation-coherence') }}
        id: release
        uses: actions/github-script@v7
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VALIDATION_REPORT: ${{ steps.validation.outputs.report_path }}

        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { prepareRelease } = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'ci/actions-recovery.mjs')).href);
            const { conferirArtefatos } = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'jojo-companion/scripts/publish-release.mjs')).href);
            const policy = JSON.parse(fs.readFileSync('ci/actions-cost-policy.json', 'utf8'));
            const report = JSON.parse(fs.readFileSync(process.env.VALIDATION_REPORT, 'utf8'));
            const { execFileSync } = require('node:child_process');
            const commit = execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
            const files = conferirArtefatos(path.join(process.env.GITHUB_WORKSPACE, 'jojo-companion/dist'), report.version);
            const result = await prepareRelease({github, policy, report, version:report.version, commit, files, releasesToken:process.env.RELEASES_TOKEN});
            if (result.publish) {
              try { execFileSync('git', ['rev-parse', '--verify', result.tag], {stdio:'ignore'}); }
              catch { execFileSync('git', ['tag', result.tag, commit]); }
              core.setOutput('publish', 'true');
              core.setOutput('tag', result.tag);
            } else core.setOutput('publish', 'false');
      - name: Publicar e conferir os tres arquivos e o atualizador
        if: ${{ success() && steps.release.outputs.publish == 'true' }}
        working-directory: jojo-companion
        run: node scripts/publish-release.mjs --tag "$env:OFFICIAL_TAG" --validation "$env:VALIDATION_REPORT"
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          OFFICIAL_TAG: ${{ steps.release.outputs.tag }}
          VALIDATION_REPORT: ${{ steps.validation.outputs.report_path }}

  assets:
    # Diagnostico manual do mesmo Actions oficial; nunca equivale aos gates de release.
    if: ${{ github.repository == 'oaovito/oao-companion-' && github.event_name == 'workflow_dispatch' && inputs.assets_only }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: jojo-companion/package-lock.json
      - name: Dependencias reprodutiveis
        working-directory: jojo-companion
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Medir limites de todas as animacoes no Windows real
        if: ${{ inputs.measure_assets }}
        working-directory: jojo-companion
        run: npx --no-install electron scripts/anim-room.mjs
      - name: Auditar desenho real
        if: ${{ inputs.measure_assets }}
        working-directory: jojo-companion
        run: npx --no-install electron scripts/auditoria-animacoes.mjs
        env:
          JOJO_ANIMATION_REPORT_DIR: out/assets-windows/animations
      - name: Preservar medicao antes dos testes de interface
        if: ${{ inputs.measure_assets }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: JoJo-windows-measurement-${{ github.run_id }}
          retention-days: 1
          path: |
            jojo-companion/assets/animations/jojo.room.json
            jojo-companion/out/assets-windows/animations
      - name: Lista de tarefas no Electron Windows real
        timeout-minutes: 9
        working-directory: jojo-companion
        run: node --test --test-concurrency=1 --test-reporter=tap test/e2e/todo.windows.mjs test/e2e/darkest.windows.mjs test/e2e/needs.windows.mjs test/e2e/focus-apps.windows.mjs test/e2e/shortcuts.windows.mjs test/e2e/living.windows.mjs
        env:
          JOJO_TEST_REPORT_DIR: out/assets-windows
      - name: Evidencias privadas e medidas para revisao
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: JoJo-windows-assets-${{ github.run_id }}
          retention-days: 1
          path: |
            jojo-companion/assets/animations/jojo.room.json
            jojo-companion/out/assets-windows
