name: Jeff Companion (Windows)

on:
  push:
    branches: ['main', 'claude/**']
    tags: ['v*']
    paths: ['jeff-companion/**', '.github/workflows/jeff-windows.yml']
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar esta versão (cria a tag v<versão> e a Release)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: jeff-companion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jeff-companion/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes unitários
        run: npm test

      - name: Gerar executável portátil, instalador e ZIP
        if: success() || failure()
        run: npx electron-builder --win --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Executável portátil (abre sem instalar)
        if: success() || failure()
        run: node scripts/smoke-portable.mjs dist/JeffCompanion.exe

      - name: Pesquisa na internet (fontes reais)
        if: success() || failure()
        continue-on-error: true
        run: node scripts/check-web-search.mjs

      - name: Integração no Windows (entrada real de mouse/teclado)
        if: success() || failure()
        run: node --test --test-concurrency=1 test/e2e/windows.e2e.mjs

      - name: E2E multiplataforma
        if: success() || failure()
        run: node --test --test-concurrency=1 test/e2e/app.e2e.mjs

      - name: Medir CPU e memória
        if: always()
        run: node scripts/measure.mjs | Tee-Object -FilePath measure-windows.json
        env:
          MEASURE_SECONDS: '20'

      - name: Publicar artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JeffCompanion-windows-x64
          path: |
            jeff-companion/dist/*.exe
            jeff-companion/dist/*.zip
            jeff-companion/measure-windows.json
          if-no-files-found: warn
          retention-days: 14

      # Publica a versão (Release do GitHub) com o executável portátil: por tag "v*"
      # ou pela execução manual com "publicar" (a tag v<versão do package.json> é criada).
      - name: Versão
        id: versao
        if: success() && (startsWith(github.ref, 'refs/tags/v') || inputs.publicar)
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publicar versão
        if: success() && (startsWith(github.ref, 'refs/tags/v') || inputs.publicar)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: JoJo ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.versao.outputs.tag }}
          body_path: jeff-companion/RELEASE_NOTES.md
          files: |
            jeff-companion/dist/JeffCompanion.exe
            jeff-companion/dist/JeffCompanion-Setup-*.exe
            jeff-companion/dist/JeffCompanion-*-win-x64.zip
