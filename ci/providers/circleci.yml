# Windows esta incluido no plano Free, mas a conta/plano desta sessao nao foi autenticada.
# default:false impede alocacao, inclusive se ja houver integracao externa instalada.
version: 2.1
parameters:
  free_windows_authorized:
    type: boolean
    default: false
jobs:
  windows:
    machine:
      image: windows-server-2022-gui:current
    resource_class: windows.medium
    shell: powershell.exe -NoLogo -NoProfile -NonInteractive -Command
    steps:
      - checkout
      - restore_cache:
          keys:
            - jojo-node-npm-v1-{{ checksum "ci/windows-toolchain.json" }}-{{ checksum "jojo-companion/package-lock.json" }}
      - run:
          name: Gates Windows e publicacao somente por tag
          no_output_timeout: 30m
          command: |
            $cache = Join-Path $env:USERPROFILE 'jojo-ci-cache'
            if ($env:CIRCLE_TAG) {
              & ./ci/windows.ps1 -Mode release -Tag $env:CIRCLE_TAG -CacheDirectory $cache
            } else {
              & ./ci/windows.ps1 -CacheDirectory $cache
            }
            exit $LASTEXITCODE
      # Nao salvar os 5 GB de runtime/pesos em armazenamento remoto da franquia Free.
      - save_cache:
          key: jojo-node-npm-v1-{{ checksum "ci/windows-toolchain.json" }}-{{ checksum "jojo-companion/package-lock.json" }}
          paths:
            - ~/jojo-ci-cache/npm
      - store_test_results:
          path: jojo-companion/out/windows-ci/summary/junit
      - store_artifacts:
          path: jojo-companion/out/windows-ci/summary
          destination: private-windows-reports
workflows:
  verified-free-windows:
    when: << pipeline.parameters.free_windows_authorized >>
    jobs:
      - windows:
          serial-group: << pipeline.project.slug >>/jojo-windows
          filters:
            branches:
              only: [main, codex/conversation-coherence]
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
